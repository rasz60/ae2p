<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>ae:p 이메일 확인</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f2;word-break:keep-all;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">버튼을 누르면 이메일 확인이 끝나요.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f4f2;">
  <tr>
    <td align="center" style="padding:40px 16px 48px;font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <tr>
          <td align="center" style="padding-bottom:20px;">
            <a href="{{ .SiteURL }}" style="text-decoration:none;"><img src="{{ .SiteURL }}/pwa-192x192.png" width="56" height="56" alt="ae:p" style="display:block;border:0;border-radius:12px;"></a>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #dfe2de;border-radius:16px;padding:36px 32px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-bottom:18px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="18" height="4" style="background:#3d63b8;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td><td width="4" style="font-size:0;line-height:0;">&nbsp;</td><td width="18" height="4" style="background:#0f7a86;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td><td width="4" style="font-size:0;line-height:0;">&nbsp;</td><td width="18" height="4" style="background:#2f8a56;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td><td width="4" style="font-size:0;line-height:0;">&nbsp;</td><td width="18" height="4" style="background:#c2562b;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
                </td>
              </tr>
              <tr>
                <td>
                <h1 style="margin:0;font-size:22px;line-height:1.4;font-weight:700;color:#171b21;">이메일 주소를 확인해 주세요</h1>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.7;color:#565d66;">ae:p 계정에 쓸 이메일 주소가 맞는지 확인하는 메일이에요.</p>
                <p style="margin:6px 0 0;font-size:15px;line-height:1.7;color:#565d66;">아래 버튼을 누르면 확인이 끝나고 바로 로그인돼요.</p>
                </td>
              </tr>
              <tr>
                <td style="padding-top:28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" bgcolor="#0a7d5a" style="background-color:#0a7d5a;border-radius:10px;">
                        <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;padding:15px 18px;font-size:16px;line-height:18px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">이메일 확인하기</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="padding-top:20px;font-size:13px;line-height:1.6;color:#565d66;">
                  버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여 넣으세요.<br>
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#07654a;word-break:break-all;">{{ .ConfirmationURL }}</a>
                </td>
              </tr>
              <tr>
                <td style="padding-top:24px;">
                  <div style="border-top:1px solid #dfe2de;font-size:0;line-height:0;">&nbsp;</div>
                </td>
              </tr>
              <tr>
                <td style="padding-top:8px;font-size:13px;line-height:1.6;color:#565d66;">
                  요청한 적이 없다면 이 메일은 무시하세요.<br>링크는 한 번만 쓸 수 있고, 시간이 지나면 만료돼요.
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:20px;font-size:12px;line-height:1.6;color:#565d66;">
            {{ .Email }} 주소로 보낸 메일이에요.<br>
            <a href="{{ .SiteURL }}" style="color:#565d66;text-decoration:underline;">ae:p takecare</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
